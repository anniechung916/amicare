version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amicare
      POSTGRES_PASSWORD: amicare_dev
      POSTGRES_DB: amicare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amicare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
